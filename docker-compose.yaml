version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: excel-processing-minio
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Console UI port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - excel-processing

volumes:
  minio_data:
    driver: local

networks:
  excel-processing:
    driver: bridge
